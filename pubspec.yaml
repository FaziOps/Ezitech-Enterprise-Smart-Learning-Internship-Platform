name: ezitech_learning_platform
description: "Ezitech Enterprise Smart Learning & Internship Mobile Platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.0.3

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  jwt_decoder: ^2.0.1

  # Firebase / notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.1

  # Media
  video_player: ^2.9.1
  chewie: ^1.8.3
  syncfusion_flutter_pdfviewer: ^26.2.7
  cached_network_image: ^3.3.1

  # Real-time
  socket_io_client: ^2.0.3+1

  # File handling / GitHub submission
  file_picker: ^8.0.6
  http: ^1.2.2

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  get_it: ^7.7.0
  logger: ^2.4.0
  uuid: ^4.4.2
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8
  firebase_auth: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
